services:
  pg:
    container_name: nest-base-pg
    image: postgres:17-alpine
    ports:
      - 1001:5432
    environment:
      POSTGRES_PASSWORD: nest-base
      POSTGRES_USER: nest-base
      POSTGRES_DB: postgres

  mongo:
    image: mongo:7.0-jammy
    container_name: nest-base-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: nest-base
      MONGO_INITDB_ROOT_PASSWORD: nest-base
    ports:
      - "1002:27017"
